<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhiqiang Yuan</title>

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c5fd6'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans|Castoro" rel="stylesheet">

  <style>
    :root {
      --accent: #2c5fd6;
      --accent-soft: #eaeffb;
      --ink: #14161a;
      --ink-soft: #4c5361;
      --line: #e6e8ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background:
        radial-gradient(760px 320px at 50% 0%, var(--accent-soft), transparent 72%),
        #fff;
      color: var(--ink);
      font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .project-link {
      display: block;
      max-width: 720px;
      padding: 34px 36px 30px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 12px 34px rgba(20, 30, 60, .06);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .project-link:hover {
      transform: translateY(-3px);
      border-color: #cfd8ee;
      box-shadow: 0 18px 44px rgba(20, 30, 60, .12);
    }

    .label {
      display: block;
      margin-bottom: 12px;
      font-size: .74rem;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 20px;
      font-family: "Castoro", Georgia, serif;
      font-weight: 400;
      font-size: 1.72rem;
      line-height: 1.4;
      letter-spacing: -.01em;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .92rem;
      font-weight: 600;
      color: var(--accent);
    }

    .project-link:hover .cta {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .project-link {
        padding: 26px 22px 24px;
      }

      h1 {
        font-size: 1.32rem;
      }
    }
  </style>
</head>

<body>

  <a class="project-link" href="./files/RDTF/index.html">
    <span class="label">Project Page</span>
    <h1>RDTF: Resource-efficient Dual-mask Training Framework for Multi-frame Animated Sticker Generation</h1>
    <span class="cta">View project page &rarr;</span>
  </a>

</body>

</html>
